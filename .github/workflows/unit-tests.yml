name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main
      - 1.*
    tags-ignore: [ v.* ]
  schedule:
    - cron: '0 2 * * *'  # every day 2am

jobs:
  classify-pr:
    name: Classify root documentation changes
    if: github.event_name == 'pull_request' && github.repository == 'apache/pekko-persistence-cassandra'
    runs-on: ubuntu-22.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout exact PR merge
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Prove that only existing root documentation files changed
        id: classify
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          import subprocess

          allowed = {b"README.md", b"CONTRIBUTING.md"}

          def git(*args):
              return subprocess.check_output(("git", *args))

          def docs_only(before, after):
              # Raw NUL-separated records preserve filenames verbatim. No rename
              # detection means a rename is seen as an add/delete and cannot qualify.
              records = git("diff", "--raw", "-z", "--no-renames", "--no-ext-diff",
                            "--no-textconv", "--ignore-submodules=none", before, after, "--")
              if not records:
                  return False
              fields = records.split(b"\0")
              return fields.pop() == b"" and len(fields) % 2 == 0 and all(
                  path in allowed and metadata.split()[:2] == [b":100644", b"100644"]
                  and metadata.split()[-1] == b"M"
                  for metadata, path in zip(fields[::2], fields[1::2])
              )

          base, head, merge = (os.environ[name] for name in ("PR_BASE_SHA", "PR_HEAD_SHA", "GITHUB_SHA"))
          if all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (base, head, merge)):
              parents = git("rev-list", "--parents", "-n", "1", merge).decode("ascii").split()
              if parents == [merge, base, head]:
                  merge_bases = git("merge-base", "--all", base, head).decode("ascii").split()
                  # Prove both the PR's own changes and the actual merge result. Any
                  # ambiguity, failure or absent proof leaves docs_only unset.
                  if len(merge_bases) == 1 and docs_only(merge_bases[0], head) and docs_only(base, merge):
                      with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                          output.write("docs_only=true\n")
          PYTHON

  test:
    name: Test
    needs: [classify-pr]
    if: >-
      ${{ always() && !cancelled() &&
          github.repository == 'apache/pekko-persistence-cassandra' &&
          (github.event_name != 'pull_request' ||
           needs.classify-pr.result != 'success' ||
           needs.classify-pr.outputs.docs_only != 'true') }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { javaVersion: '17',  container: "cassandra-latest",  scalaVersion: "2.13", test: "test" }
          - { javaVersion: '17',  container: "cassandra-latest",  scalaVersion: "3.3", test: "test" }
          - { javaVersion: '17',  container: "cassandra-latest",  scalaVersion: "next", test: "test" }
          - { javaVersion: '21', container: "cassandra-latest",  scalaVersion: "2.13", test: "test" }
          - { javaVersion: '21', container: "cassandra-latest",  scalaVersion: "3.3", test: "test" }
          - { javaVersion: '21', container: "cassandra-latest",  scalaVersion: "next", test: "test" }
          - { javaVersion: '17', container: "cassandra2",        scalaVersion: "2.13", test: "'testOnly -- -l RequiresCassandraThree'"}
          - { javaVersion: '17', container: "cassandra3",        scalaVersion: "2.13", test: "test" }
          - { javaVersion: '17', container: "scylladb-latest",   scalaVersion: "2.13", test: "test" }

    env:
      JAVA_OPTS: -Xms2G -Xmx2G -Xss2M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Setup Java ${{ matrix.javaVersion }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.javaVersion }}

      - name: Cache Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Test against ${{ matrix.container }}
        run: |-
          scala_version="$(bash .github/scripts/resolve-scala-version.sh "${{ matrix.scalaVersion }}")"
          docker compose up -d ${{ matrix.container }} && sbt "++${scala_version}!" ${{matrix.test}}

  mima:
    name: MiMa check
    if: github.repository == 'apache/pekko-persistence-cassandra'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: MiMa Check
        run: sbt +mimaReportBinaryIssues

  docs:
    name: ScalaDoc, Documentation with Paradox
    if: github.repository == 'apache/pekko-persistence-cassandra'
    runs-on: ubuntu-22.04
    env:
      JAVA_OPTS: -Xms2G -Xmx2G -Xss2M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Create all API docs for artifacts/website and all reference docs
        run: sbt "unidoc; docs/paradox"
